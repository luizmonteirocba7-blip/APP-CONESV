<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa de Inventário - Evento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    
    <style>
        /* Animação flutuante para os pinos */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        
        /* Ajuste estrutural do pino */
        .marker-pin {
            position: absolute;
            transform: translate(-50%, -100%);
            z-index: 10;
        }

        /* Trava a tela inteira para evitar scroll nativo do navegador */
        html, body {
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
        }
    </style>
</head>
<body class="font-sans relative text-slate-800 bg-slate-900 h-[100dvh]">

    <div class="fixed inset-0 z-0">
        <!-- Fundo Desfocado Atualizado com a nova imagem -->
        <img src="https://drive.google.com/thumbnail?id=1_7E8kEqzLm7t7IttUz9jJmoEoNHHYVSx&sz=w2500" 
             class="w-full h-full object-cover" 
             alt="Imagem de Fundo">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm"></div>
    </div>

    <header class="bg-slate-900/80 backdrop-blur-md text-white p-3 md:p-4 shadow-lg flex flex-col md:flex-row justify-between items-center gap-2 fixed top-0 w-full z-20 border-b border-white/10 h-auto md:h-16">
        <div class="flex items-center gap-3">
            <h1 class="text-base md:text-xl font-bold tracking-wide text-center">Gestão de Inventário</h1>
        </div>
        <div class="text-xs md:text-sm bg-white/10 backdrop-blur-sm px-3 py-1.5 rounded-full border border-white/10 flex items-center gap-2">
            Conectado ao Sheets <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
        </div>
    </header>

    <main class="pt-[80px] md:pt-[88px] pb-4 px-2 md:px-6 w-full h-[100dvh] flex flex-col relative z-10 pointer-events-none">
        
        <div class="absolute top-24 left-1/2 transform -translate-x-1/2 z-30 bg-slate-900/60 backdrop-blur text-white text-xs px-4 py-1.5 rounded-full pointer-events-none opacity-80 shadow-lg border border-white/10 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11" /></svg>
            Arraste e use a pinça para zoom
        </div>

        <div class="relative w-full max-w-7xl mx-auto flex-1 flex flex-col overflow-hidden bg-transparent rounded-xl md:rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.5)] ring-1 ring-white/20 pointer-events-auto cursor-grab active:cursor-grabbing" id="map-wrapper">
            
            <div id="map-container" class="relative w-[1200px] md:w-full h-auto origin-center select-none" style="margin: auto;">
                
                <!-- Mapa Principal Atualizado (Croqui) -->
                <img 
                    src="https://drive.google.com/thumbnail?id=1LbxYyVez6prfKQA_FwaO1jAYsEeZZ2Eu&sz=w2500" 
                    alt="Planta do Evento" 
                    class="w-full h-auto block pointer-events-none"
                    draggable="false"
                    onerror="this.src='https://placehold.co/1200x800/e2e8f0/475569?text=Erro+ao+carregar+imagem+do+Drive'"
                >

                <div id="markers-container" class="absolute inset-0"></div>

            </div>
            
            <div class="absolute bottom-4 right-4 flex flex-col gap-2 z-30">
                <button id="zoom-in" class="w-11 h-11 bg-white/90 backdrop-blur-md shadow-lg rounded-full flex items-center justify-center text-slate-800 hover:bg-slate-100 active:scale-90 transition-all border border-slate-200" title="Aumentar Zoom">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
                <button id="zoom-out" class="w-11 h-11 bg-white/90 backdrop-blur-md shadow-lg rounded-full flex items-center justify-center text-slate-800 hover:bg-slate-100 active:scale-90 transition-all border border-slate-200" title="Diminuir Zoom">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
            
        </div>
    </main>

    <div id="inventoryModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 md:p-4 pointer-events-auto">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md max-h-[90vh] flex flex-col overflow-hidden transform transition-all scale-95 opacity-0 border border-white/20" id="modalContent">
            
            <div class="bg-slate-800 text-white px-5 py-3 md:py-4 flex justify-between items-center shrink-0">
                <h2 id="modalTitle" class="text-base md:text-lg font-bold truncate pr-2">Inventário</h2>
                <button onclick="closeModal()" class="text-slate-300 hover:text-white transition-colors bg-white/10 hover:bg-white/20 rounded-full p-1.5 md:p-1 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>

            <div class="p-4 md:p-6 overflow-y-auto">
                <div id="loadingIndicator" class="flex flex-col items-center justify-center py-6 md:py-8">
                    <div class="animate-spin rounded-full h-8 w-8 md:h-10 md:w-10 border-b-2 border-slate-800 mb-4"></div>
                    <p class="text-slate-500 font-medium text-sm md:text-base">A carregar dados...</p>
                </div>

                <div id="inventoryListContainer" class="hidden flex-col h-full">
                    <ul id="inventoryList" class="space-y-2 md:space-y-3 pb-2">
                        </ul>
                    <div class="mt-4 pt-4 border-t border-slate-200 flex justify-end shrink-0">
                        <button onclick="closeModal()" class="px-4 py-2 md:px-5 md:py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-800 text-sm md:text-base rounded-lg font-semibold transition-colors shadow-sm w-full md:w-auto">
                            Fechar
                        </button>
                    </div>
                </div>

                <div id="emptyMessage" class="hidden text-center py-8 text-slate-500">
                    <p class="text-sm md:text-base">Nenhum material encontrado para esta área.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- INICIALIZAÇÃO DO PANZOOM ---
        const mapContainer = document.getElementById('map-container');
        const mapWrapper = document.getElementById('map-wrapper');
        
        const panzoom = Panzoom(mapContainer, {
            maxScale: 4,
            minScale: 0.4,
            step: 0.2,
            cursor: 'grab',
            touchAction: 'none'
        });

        mapWrapper.addEventListener('wheel', panzoom.zoomWithWheel);

        document.getElementById('zoom-in').addEventListener('click', panzoom.zoomIn);
        document.getElementById('zoom-out').addEventListener('click', panzoom.zoomOut);

        // --- CONFIGURAÇÃO DOS 10 MARCADORES CONFORME A IMAGEM ENVIADA ---
        const mapMarkers = [
            { id: 'ponto-1', title: 'Stand Superior Esquerdo', top: 23, left: 27 },
            { id: 'ponto-2', title: 'Área 50 Mesas', top: 24.5, left: 49 },
            { id: 'ponto-3', title: 'Feedback', top: 20, left: 69.5 },
            { id: 'ponto-4', title: 'Stands Superior Direito', top: 26, left: 81.5 },
            { id: 'ponto-5', title: 'Simulação Acidente', top: 49.5, left: 26 },
            { id: 'ponto-6', title: 'Tendas Centrais', top: 55.5, left: 54 },
            { id: 'ponto-7', title: 'Lateral Direita', top: 53.5, left: 72 },
            { id: 'ponto-8', title: 'Carros Uso Diário', top: 80, left: 16 },
            { id: 'ponto-9', title: 'Área Inferior Central', top: 88.5, left: 52 },
            { id: 'ponto-10', title: 'Estacionamento Direito', top: 61, left: 80 }
        ];

        function renderMarkers() {
            const container = document.getElementById('markers-container');
            container.innerHTML = ''; 

            mapMarkers.forEach(marker => {
                const randomDelay = (Math.random() * 2).toFixed(1);

                const markerHTML = `
                    <div class="marker-pin cursor-pointer group" style="top: ${marker.top}%; left: ${marker.left}%;" 
                         onclick="openModal('${marker.id}', '${marker.title}')"
                         onpointerdown="event.stopPropagation();" >
                        
                        <div class="absolute -inset-4 z-20 rounded-full"></div>

                        <div class="relative flex flex-col items-center animate-float" style="animation-delay: ${randomDelay}s;">
                            <div class="absolute bottom-full mb-1 bg-slate-900/80 backdrop-blur-sm text-white text-[10px] font-bold px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap shadow-lg pointer-events-none border border-white/10 z-50">
                                ${marker.title}
                            </div>
                            <div class="w-6 h-6 bg-blue-500/20 backdrop-blur-sm border border-blue-400/40 group-hover:bg-blue-500/50 rounded-full flex items-center justify-center text-blue-800 group-hover:text-white transition-all transform group-hover:scale-110 relative z-10">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>
                            </div>
                            <div class="w-0 h-0 border-l-[4px] border-l-transparent border-r-[4px] border-r-transparent border-t-[5px] border-t-blue-400/40 group-hover:border-t-blue-500/50 -mt-[1px] transition-colors z-0"></div>
                        </div>
                        
                        <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 translate-y-1/2 w-4 h-4 border border-blue-400/30 rounded-full opacity-0 animate-[ping_2.5s_cubic-bezier(0,0,0.2,1)_infinite]" style="animation-delay: ${randomDelay}s;"></div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', markerHTML);
            });
        }

        // --- DADOS SIMULADOS PARA OS 10 PONTOS ---
        const mockDatabase = {
            'ponto-1': [
                { item: 'Cadeiras', qtd: 20, status: 'ok' }
            ],
            'ponto-2': [
                { item: 'Mesas Redondas', qtd: 30, status: 'ok' },
                { item: 'Cadeiras', qtd: 120, status: 'attention' }
            ],
            'ponto-3': [
                { item: 'Lixeiras', qtd: 5, status: 'missing' }
            ],
            'ponto-4': [
                { item: 'Balcão', qtd: 1, status: 'ok' }
            ],
            'ponto-5': [
                { item: 'Palco/Estrutura', qtd: 1, status: 'ok' },
                { item: 'Iluminação', qtd: 4, status: 'attention' }
            ],
            'ponto-6': [
                { item: 'Tendas 3x3', qtd: 12, status: 'ok' }
            ],
            'ponto-7': [
                { item: 'Grades de Isolamento', qtd: 10, status: 'ok' }
            ],
            'ponto-8': [
                { item: 'Cone de Sinalização', qtd: 15, status: 'attention' }
            ],
            'ponto-9': [
                { item: 'Placas de Sinalização', qtd: 3, status: 'missing' }
            ],
            'ponto-10': [
                { item: 'Rádio Comunicador', qtd: 2, status: 'ok' }
            ]
        };

        window.addEventListener('DOMContentLoaded', renderMarkers);

        // --- CONTROLE DO MODAL ---
        const modal = document.getElementById('inventoryModal');
        const modalContent = document.getElementById('modalContent');
        const modalTitle = document.getElementById('modalTitle');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const inventoryListContainer = document.getElementById('inventoryListContainer');
        const inventoryList = document.getElementById('inventoryList');
        const emptyMessage = document.getElementById('emptyMessage');

        function openModal(zoneId, zoneName) {
            modalTitle.innerText = `Inventário: ${zoneName}`;
            inventoryList.innerHTML = '';
            loadingIndicator.classList.remove('hidden');
            inventoryListContainer.classList.add('hidden');
            emptyMessage.classList.add('hidden');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);

            setTimeout(() => {
                const data = mockDatabase[zoneId];
                populateList(data);
            }, 500); 
        }

        function closeModal() {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        function populateList(items) {
            loadingIndicator.classList.add('hidden');

            if (!items || items.length === 0) {
                emptyMessage.classList.remove('hidden');
                return;
            }

            inventoryListContainer.classList.remove('hidden');
            inventoryListContainer.classList.add('flex');

            items.forEach(item => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center bg-slate-50 p-2.5 md:p-3 rounded-lg border border-slate-200 shadow-sm transition-colors hover:bg-slate-100";
                
                let statusColor = 'bg-green-100 text-green-700';
                if (item.status === 'attention') statusColor = 'bg-yellow-100 text-yellow-700';
                if (item.status === 'missing') statusColor = 'bg-red-100 text-red-700';

                li.innerHTML = `
                    <div class="flex items-center gap-2 md:gap-3 flex-1 min-w-0 pr-2">
                        <div class="w-2.5 h-2.5 rounded-full shrink-0 ${statusColor.split(' ')[0].replace('100', '500')}"></div>
                        <span class="font-semibold text-slate-700 text-sm md:text-base truncate" title="${item.item}">${item.item}</span>
                    </div>
                    <span class="px-2 md:px-3 py-1 rounded-full text-[10px] md:text-xs font-bold uppercase tracking-wide shrink-0 ${statusColor}">
                        Qtd: ${item.qtd}
                    </span>
                `;
                inventoryList.appendChild(li);
            });
        }
    </script>
</body>
</html>
